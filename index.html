<html>

<head>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('frog', {
      init: function () {
        const el = this.el;
        el.addEventListener('mouseenter', () => el.object3D.scale.set(1.1, 1.1, 1.1));
        el.addEventListener('mouseleave', () => el.object3D.scale.set(1, 1, 1));
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js">
  </script>
</head>

<body>
  <div style ="position: fixed; top: 10px; left: 10px; z-index: 10; color: rgb(151, 128, 255); font-size: 20px;">
  <p id="count">Jumps: 0</p>
  <p id="timer">Time: 10</p>
  <button id="startBtn">Start</button>
  </div>
  
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    <a-assets>
      <img id="sky-360" src="background.jpg" crossorigin="anonymous">
      <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
      <a-asset-item id="center-model" src="TreeScene.glb"></a-asset-item>
      <a-asset-item id="frog-model" src="frog_stylized_cute_character.glb"></a-asset-item>

    </a-assets>

    <a-entity id="cameraRig" position="0 0.8 3" movement-controls>
      <a-camera wasd-controls-enabled="false" look-controls-enabled="true">
        
      </a-camera>

      <a-entity id="frog" class="clickable" frog gltf-model="#frog-model" position="0 1 -2" rotation="0 0 0"
        animation__hop="property: object3D.position.y; from: 1; to: 1.6; dur: 250; dir:alternate; loop: 2; easing: easeOutQuad; startEvents: click">
      </a-entity>
    </a-entity>

    <a-sky src="#sky-360" rotation="0 -90 0"></a-sky>


    <a-gltf-model src="TreeScene.glb" position="0 0.7 0" rotation="0 -18 0" scale="2 2 2">
    </a-gltf-model>


    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" position="2 4 3" intensity="1.2"></a-light>

  </a-scene>
  <script>
    let jumps = 0;
    let time = 10;
    let playing = false;

    document.getElementById("startBtn").addEventListener("click", function () {
    jumps = 0;
    time = 10;
    playing = true;
    document.getElementById("count").innerHTML = "Jumps: 0";
    document.getElementById("timer").innerHTML = "Time: 10";

    let countdown = setInterval(function () {
      time--;
      document.getElementById("timer").innerHTML = "Time: " + time;

      if (time == 0) {
        clearInterval(countdown);
        playing = false;
        document.getElementById("timer").innerHTML = "Game over! You got " + jumps + " jumps!";
      }
    }, 1000);
  });

  document.getElementById("frog").addEventListener("click", function () {
    if (playing) {
      jumps++;
      document.getElementById("count").innerHTML = "Jumps: " + jumps;
    }
  });
</script>
</body>

</html>
