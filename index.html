<html>

<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script
        src="https://unpkg.com/aframe-environment-component@1.5.x/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
</head>

<body>
    <a-scene>
        <a-entity environment="preset: forest; dressingAmount: 500"></a-entity>
        <a-entity gltf-model="url(Tree_Scene.glb)"></a-entity>
        <a-entity id="cameraRig" position="0 1.6 0" movement-controls>
            <a-camera wasd-controls-enabled="false" look-controls-enabled="true">
                <a-cursor></a-cursor>
            </a-camera>
             <a-box color="yellow" position="0 0 -2" rotation="0 0 0" scale="0.5 0.5 0.5"></a-box>
        </a-entity>
    </a-scene>
</body>

</html>
