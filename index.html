<html>

<head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
   <script>
  AFRAME.registerComponent('frog', {
    init: function () {
      const el = this.el;
      el.addEventListener('mouseenter', () => el.object3D.scale.set(0.2, 0.2, 0.2));
      el.addEventListener('mouseleave', () => el.object3D.scale.set(0.1, 0.1, 0.1));
    }
  });
</script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js">
    </script> 
</head>

<body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <a-assets>
        <img id="sky-360" src="background.jpg" crossorigin="anonymous">
        <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
        <a-asset-item id="frog-model" src="Forest_Frog.glb"></a-asset-item>
        <a-asset-item id="center-model" src="TreeScene.glb"></a-asset-item>
        
      </a-assets>

      <a-entity id="cameraRig" position="0 1.6 3" movement-controls>
            <a-camera wasd-controls-enabled="false" look-controls-enabled="true">
                <a-cursor></a-cursor>
            </a-camera>
      </a-entity>

        <a-sky src="#sky-360" rotation="0 -90 0"></a-sky>
      
        <a-entity id="frog" class="clickable" frog
      gltf-model="#frog-model" position="1 1.5 1" rotation="0 180 0" scale="0.1 0.1 0.1"
      animation__hop="property: object3D.position.y; from: 0; to: 0.6; dur: 250; dir:alternate; loop: 2; easing: easeOutQuad; startEvents: click">
        </a-entity>

      <a-gltf-model 
        src="TreeScene.glb" 
        position="0 1.4 0"  
        rotation="0 -18 0">
      </a-gltf-model>


      <a-light type="ambient" intensity="0.8"></a-light>
      <a-light type="directional" position="2 4 3" intensity="1.2"></a-light>

    </a-scene>
</body>

</html>
